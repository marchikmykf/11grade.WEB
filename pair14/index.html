<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
<main class = "course-card" id = "card">
  <p class = "tag">Освітня платформа</p>
  <h1>Курс з веброзробки</h1>
  <p id ="welcome">Вітаємо, гостю!</p>

  <label for="studentsName">Your name</label>
  <input id="studentsName" type="text" placeholder="Введіть імʼя">

   <label for="format">Format studying</label>
   <select id="format">
       <option value="2000">Offline - 2000 UAH</option>
       <option value="1500">Online - 1500 UAH</option>
   </select>
    <p>Price: <strong id="price">2000 uah.</strong></p>
    <button id="enrollBtn">Записатися</button>
    <p id = "status">Ви ще не записані на курс</p>
    <button id = "detailBtn" class ="secondary">Показати опис</button>
    <p class ="hidden" id="details">Практичний курс з веброзробки</p>
    <button id="themeBtn" class="secondary">Темна тема</button>
</main>
<script src="script.js" defer></script>
</body>
</html>
